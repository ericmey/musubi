# Public Musubi stack. The operator supplies inference endpoints in .env.
# For local GPU inference, also use deploy/docker/compose.local-gpu.yml.
name: musubi

x-core-image: &core-image ghcr.io/sourceblender/musubi-core@sha256:887a4b8af778da49c7795fbfe1332465521de37b436caa9f94462b9d43e10af9
x-core-version: &core-version v1.27.12
x-core-env: &core-env
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  QDRANT_API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
  MUSUBI_SERVICE_VERSION: *core-version
  TEI_DENSE_URL: ${TEI_DENSE_URL:?Set TEI_DENSE_URL in .env}
  TEI_SPARSE_URL: ${TEI_SPARSE_URL:?Set TEI_SPARSE_URL in .env}
  TEI_RERANKER_URL: ${TEI_RERANKER_URL:?Set TEI_RERANKER_URL in .env}
  OLLAMA_URL: ${OLLAMA_URL:?Set OLLAMA_URL in .env}
  MUSUBI_ALLOW_PLAINTEXT: "true"
  BRAIN_PORT: "8100"
  VAULT_PATH: /var/lib/musubi/vault
  ARTIFACT_BLOB_PATH: /var/lib/musubi/artifact-blobs
  LIFECYCLE_SQLITE_PATH: /var/lib/musubi/lifecycle/work.sqlite
  LOG_DIR: /var/log/musubi

services:
  volume-init:
    # The published Core image runs as UID 999/GID 985. New named volumes
    # start root-owned, so grant that user the volume roots before Core boots.
    image: *core-image
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 999:985 /var/lib/musubi/vault /var/lib/musubi/artifact-blobs /var/lib/musubi/lifecycle /var/log/musubi"]
    volumes:
      - vault:/var/lib/musubi/vault
      - artifact-blobs:/var/lib/musubi/artifact-blobs
      - lifecycle:/var/lib/musubi/lifecycle
      - logs:/var/log/musubi
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.17.1@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 6<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  core:
    image: *core-image
    env_file: ${MUSUBI_ENV_FILE:-.env}
    environment:
      <<: *core-env
      # env_file may contain worker-only settings; do not give its LLM key to Core.
      LIFECYCLE_LLM_API_KEY: ""
    volumes:
      - vault:/var/lib/musubi/vault
      - artifact-blobs:/var/lib/musubi/artifact-blobs
      - lifecycle:/var/lib/musubi/lifecycle
      - logs:/var/log/musubi
    ports:
      - "${MUSUBI_CORE_BIND:-127.0.0.1}:${MUSUBI_CORE_PORT:-8100}:8100"
    depends_on:
      volume-init: {condition: service_completed_successfully}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/v1/ops/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  lifecycle-worker:
    image: *core-image
    env_file: ${MUSUBI_ENV_FILE:-.env}
    environment: *core-env
    command: ["python", "-m", "musubi.lifecycle.runner"]
    volumes:
      - vault:/var/lib/musubi/vault
      - artifact-blobs:/var/lib/musubi/artifact-blobs
      - lifecycle:/var/lib/musubi/lifecycle
      - logs:/var/log/musubi
    depends_on:
      core: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; b=urllib.request.urlopen('http://localhost:8101/metrics', timeout=2).read().decode(); v=[l.split()[-1] for l in b.splitlines() if l.startswith('musubi_lifecycle_coordinator_ready ')]; sys.exit(0 if v and float(v[-1]) == 1.0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  qdrant-storage:
  qdrant-snapshots:
  vault:
  artifact-blobs:
  lifecycle:
  logs:
