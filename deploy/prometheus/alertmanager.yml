# Example Alertmanager routing for Musubi alerts.
# Musubi does not run Alertmanager; copy this into the one you run.
# See docs/Musubi/09-operations/alerts.md for the rule set it routes.
#
# Replace before use:
#   - the ntfy URL: your own ntfy server, or an unguessable topic. Anyone who
#     knows a public topic name can read every alert sent to it.
#   - the email addresses and smarthost.
#
# Musubi Core has no alert-receiving endpoint, so nothing here posts to it.

global:
  resolve_timeout: 5m

route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - matchers:
        - 'severity="push"'
      receiver: ntfy
      repeat_interval: 30m
    - matchers:
        - 'severity="email"'
      receiver: email
      repeat_interval: 24h

receivers:
  - name: ntfy
    webhook_configs:
      - url: "https://ntfy.example.com/replace-with-an-unguessable-topic"
  - name: email
    email_configs:
      - to: admin@example.com
        from: alertmanager@example.com
        smarthost: smtp.example.com:587
        require_tls: true
