---
- name: Rotate Musubi shared-inference authentication without a mismatch window
  hosts: musubi
  become: true
  force_handlers: true
  handlers:
    - name: Remove auth rollback and staged material after an early failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ auth_rotation_backup.path }}"
        - "{{ musubi_config_dir }}/shared-inference.htpasswd.rotation.tpl"
        - "{{ musubi_config_dir }}/secrets.shared-inference-v2.tpl"
      check_mode: false
  tasks:
    - name: Inspect completed authentication migration marker
      ansible.builtin.stat:
        path: "{{ musubi_config_dir }}/shared-inference-auth-v2"
      register: completed_auth_migration

    - name: Verify the completed migration is still healthy
      ansible.builtin.uri:
        url: "{{ musubi_health_urls.core }}"
        status_code: 200
      changed_when: false
      when: completed_auth_migration.stat.exists

    - name: Verify the completed migration still reaches every authenticated route
      ansible.builtin.command:
        cmd: >-
          /usr/bin/docker compose -f {{ musubi_config_dir }}/docker-compose.yml
          exec -T core python -c
          'import httpx,os;
          auth=httpx.BasicAuth(os.environ["TEI_BASIC_AUTH_USERNAME"],os.environ["TEI_BASIC_AUTH_PASSWORD"]);
          urls=[os.environ[k] for k in ("TEI_DENSE_URL","TEI_SPARSE_URL","TEI_RERANKER_URL")];
          [httpx.get(u+"/health",auth=auth,timeout=20).raise_for_status() for u in urls]'
      changed_when: false
      no_log: true
      when: completed_auth_migration.stat.exists

    - name: Stop after validating an already completed migration
      ansible.builtin.meta: end_host
      when: completed_auth_migration.stat.exists

    - name: Allocate auth rollback material
      ansible.builtin.tempfile:
        state: directory
        prefix: musubi-shared-inference-auth-rollback.
      register: auth_rotation_backup
      check_mode: false
      notify: Remove auth rollback and staged material after an early failure

    - name: Preserve every coupled authentication artifact
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ auth_rotation_backup.path }}/{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop:
        - src: "{{ musubi_config_dir }}/secrets.tpl"
          dest: secrets.tpl
        - src: "{{ musubi_config_dir }}/docker-compose.yml"
          dest: docker-compose.yml
        - src: "{{ musubi_config_dir }}/shared-inference-compose.yml"
          dest: shared-inference-compose.yml
        - src: "{{ musubi_config_dir }}/.env.production"
          dest: .env.production
        - src: "{{ musubi_config_dir }}/shared-inference.htpasswd.tpl"
          dest: shared-inference.htpasswd.tpl
        - src: /run/shared-inference-secrets/shared-inference.htpasswd
          dest: shared-inference.htpasswd
      no_log: true

    - name: Stage overlapping ingress credential references
      ansible.builtin.template:
        src: templates/shared-inference.htpasswd.transition.tpl.j2
        dest: "{{ musubi_config_dir }}/shared-inference.htpasswd.rotation.tpl"
        owner: root
        group: "{{ musubi_service_group }}"
        mode: "0640"
      no_log: true

    - name: Stage replacement Musubi credential references
      ansible.builtin.template:
        src: templates/secrets.tpl.j2
        dest: "{{ musubi_config_dir }}/secrets.shared-inference-v2.tpl"
        owner: root
        group: "{{ musubi_service_group }}"
        mode: "0640"
      no_log: true

    - name: Inspect the stable producer network before rotation
      community.docker.docker_network_info:
        name: musubi-inference-backend
      register: producer_backend_network
      changed_when: false

    - name: Inspect every shared-inference producer before rotation
      community.docker.docker_container_info:
        name: "shared-inference-{{ item }}-1"
      loop:
        - tei-dense
        - tei-sparse
        - tei-reranker
      register: producer_container_info
      changed_when: false

    - name: Initialize non-secret producer readiness projection
      ansible.builtin.set_fact:
        producer_status: []
      changed_when: false

    - name: Project producer readiness without assuming a container exists
      ansible.builtin.set_fact:
        producer_status: >-
          {{ producer_status + [{
               'exists': item.exists | default(false),
               'running':
                 (item.container | default({})).get('State', {}).get('Running', false),
               'health':
                 (item.container | default({})).get('State', {}).get('Health', {}).get(
                   'Status', 'missing'),
               'attached':
                 'musubi-inference-backend' in
                 (item.container | default({})).get('NetworkSettings', {}).get('Networks', {})
             }] }}
      loop: "{{ producer_container_info.results }}"
      changed_when: false

    - name: Decide whether producer topology requires reconciliation
      ansible.builtin.set_fact:
        producer_reconcile_required: >-
          {{
            not producer_backend_network.exists or
            (producer_status |
             selectattr('exists', 'equalto', true) | list | length != 3) or
            (producer_status |
             selectattr('running', 'equalto', true) | list | length != 3) or
            (producer_status |
             selectattr('health', 'equalto', 'healthy') | list | length != 3) or
            (producer_status |
             selectattr('attached', 'equalto', true) | list | length != 3)
          }}
      changed_when: false

    - name: Rotate the exposed Musubi credential transactionally
      block:
        - name: Install the overlapping credential set
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              candidate=$(mktemp /run/shared-inference-secrets/htpasswd.XXXXXX) &&
              trap 'rm -f "$candidate"' EXIT &&
              /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/op inject --force
              -i {{ musubi_config_dir }}/shared-inference.htpasswd.rotation.tpl
              -o "$candidate" &&
              chown 101:101 "$candidate" &&
              chmod 0400 "$candidate" &&
              mv -f "$candidate" /run/shared-inference-secrets/shared-inference.htpasswd
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Render the replacement shared-inference Compose definition
          ansible.builtin.template:
            src: templates/shared-inference-compose.yml.j2
            dest: "{{ musubi_config_dir }}/shared-inference-compose.yml"
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          diff: false

        - name: Reconcile the producer network before starting its consumers
          ansible.builtin.command:
            cmd: >-
              /usr/bin/timeout --signal=TERM --kill-after=5s 320s
              /usr/bin/docker compose -p shared-inference
              -f {{ musubi_config_dir }}/shared-inference-compose.yml
              up -d --force-recreate --wait --wait-timeout 300
          changed_when: true
          when: producer_reconcile_required

        - name: Remount overlapping credentials without restarting ready producers
          ansible.builtin.command:
            cmd: >-
              /usr/bin/timeout --signal=TERM --kill-after=5s 30s
              /usr/bin/docker compose -p shared-inference
              -f {{ musubi_config_dir }}/shared-inference-compose.yml
              up -d --no-deps --force-recreate inference-ingress
          changed_when: true
          no_log: true
          when: not producer_reconcile_required

        - name: Prove both old and replacement credentials during overlap
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              /usr/bin/timeout --signal=TERM --kill-after=1s 5s /usr/bin/op run
              --env-file={{ auth_rotation_backup.path }}/secrets.tpl --
              /bin/bash -ec '
              {
              if [[ -n "${TEI_BASIC_AUTH_USERNAME:-}" || -n "${TEI_BASIC_AUTH_PASSWORD:-}" ]]; then
                [[ -n "${TEI_BASIC_AUTH_USERNAME:-}" && -n "${TEI_BASIC_AUTH_PASSWORD:-}" ]] || exit 2;
                printf "user = \"%s:%s\"\n" "$TEI_BASIC_AUTH_USERNAME" "$TEI_BASIC_AUTH_PASSWORD";
              fi;
              printf "url = \"%s/health\"\n" "$TEI_DENSE_URL";
              } |
              docker run --rm -i --network musubi-shared-inference
              {{ musubi_curl_image }} --config - --connect-timeout 2 --max-time 3
              --fail --silent --show-error >/dev/null' &&
              /usr/bin/timeout --signal=TERM --kill-after=1s 5s /usr/bin/op run
              --env-file={{ musubi_config_dir }}/secrets.shared-inference-v2.tpl --
              /bin/bash -ec '
              printf "user = \"%s:%s\"\nurl = \"%s/health\"\n"
              "$TEI_BASIC_AUTH_USERNAME" "$TEI_BASIC_AUTH_PASSWORD" "$TEI_DENSE_URL" |
              docker run --rm -i --network musubi-shared-inference
              {{ musubi_curl_image }} --config - --connect-timeout 2 --max-time 3
              --fail --silent --show-error >/dev/null'
            executable: /bin/bash
          changed_when: false
          no_log: true
          register: auth_overlap_probe
          retries: 30
          delay: 1
          until: auth_overlap_probe.rc == 0

        - name: Render the replacement Musubi Compose definition
          ansible.builtin.template:
            src: templates/docker-compose.yml.j2
            dest: "{{ musubi_config_dir }}/docker-compose.yml"
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          diff: false

        - name: Render the replacement Musubi environment
          ansible.builtin.template:
            src: templates/env.production.j2
            dest: "{{ musubi_config_dir }}/.env.production"
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          no_log: true

        - name: Pull the pinned replacement Musubi image
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              exec /usr/bin/timeout --signal=TERM --kill-after=1s 109s /usr/bin/op run
              --env-file={{ musubi_config_dir }}/secrets.shared-inference-v2.tpl --
              /usr/bin/docker compose -f {{ musubi_config_dir }}/docker-compose.yml
              pull --policy always core lifecycle-worker
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Commit replacement Musubi credential references
          ansible.builtin.copy:
            src: "{{ musubi_config_dir }}/secrets.shared-inference-v2.tpl"
            dest: "{{ musubi_config_dir }}/secrets.tpl"
            remote_src: true
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          no_log: true

        - name: Restart Musubi with the replacement credential
          ansible.builtin.systemd_service:
            name: musubi
            state: restarted

        - name: Wait for the replacement Musubi core to become healthy
          ansible.builtin.uri:
            url: "{{ musubi_health_urls.core }}"
            status_code: 200
          register: migrated_core_health
          retries: 12
          delay: 5
          until: migrated_core_health.status == 200
          changed_when: false

        - name: Wait for the replacement lifecycle worker to become healthy
          community.docker.docker_container_info:
            name: musubi-lifecycle-worker-1
          register: migrated_lifecycle_info
          retries: 60
          delay: 5
          until: >-
            migrated_lifecycle_info.exists and
            migrated_lifecycle_info.container.State.Running and
            migrated_lifecycle_info.container.State.Health.Status == 'healthy'
          changed_when: false
          no_log: true

        - name: Inspect migrated Musubi consumers
          community.docker.docker_container_info:
            name: "musubi-{{ item }}-1"
          loop:
            - core
            - lifecycle-worker
          register: migrated_consumer_info
          no_log: true

        - name: Project non-secret migrated consumer status
          ansible.builtin.set_fact:
            migrated_consumer_status: >-
              {{ (migrated_consumer_status | default([])) + [{
                   'service': item.item,
                   'image': item.container.Config.Image,
                   'running': item.container.State.Running,
                   'health': item.container.State.Health.Status | default('not-configured')
                 }] }}
          loop: "{{ migrated_consumer_info.results }}"
          no_log: true

        - name: Require migrated consumers to run the pinned image
          ansible.builtin.assert:
            that:
              - item.image == musubi_core_image
              - item.running
              - >-
                item.service != 'lifecycle-worker' or
                item.health == 'healthy'
            fail_msg: >-
              {{ item.service }} migration readiness failed
              (image_match={{ item.image == musubi_core_image }},
              running={{ item.running }}, health={{ item.health }})
            quiet: true
          loop: "{{ migrated_consumer_status }}"
          loop_control:
            label: "{{ item.service }}"

        - name: Prove the real Musubi consumer uses the replacement credential
          ansible.builtin.shell:
            cmd: >-
              /usr/bin/docker compose -f {{ musubi_config_dir }}/docker-compose.yml
              exec -T core python -c 'import httpx,os;
              auth=httpx.BasicAuth(os.environ["TEI_BASIC_AUTH_USERNAME"],os.environ["TEI_BASIC_AUTH_PASSWORD"]);
              urls=[os.environ[k] for k in ("TEI_DENSE_URL","TEI_SPARSE_URL","TEI_RERANKER_URL")];
              [httpx.get(u+"/health",auth=auth,timeout=20).raise_for_status() for u in urls]'
            executable: /bin/bash
          changed_when: false
          no_log: true

        - name: Render the replacement-only ingress credential references
          ansible.builtin.template:
            src: templates/shared-inference.htpasswd.tpl.j2
            dest: "{{ musubi_config_dir }}/shared-inference.htpasswd.tpl"
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          no_log: true

        - name: Remove the exposed credential from the ingress
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              candidate=$(mktemp /run/shared-inference-secrets/htpasswd.XXXXXX) &&
              trap 'rm -f "$candidate"' EXIT &&
              /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/op inject --force
              -i {{ musubi_config_dir }}/shared-inference.htpasswd.tpl
              -o "$candidate" &&
              chown 101:101 "$candidate" &&
              chmod 0400 "$candidate" &&
              mv -f "$candidate" /run/shared-inference-secrets/shared-inference.htpasswd &&
              /usr/bin/timeout --signal=TERM --kill-after=5s 30s
              docker compose -p shared-inference
              -f {{ musubi_config_dir }}/shared-inference-compose.yml
              up -d --no-deps --force-recreate inference-ingress
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Prove the exposed credential is rejected
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              exec /usr/bin/timeout --signal=TERM --kill-after=1s 5s /usr/bin/op run
              --env-file={{ auth_rotation_backup.path }}/secrets.tpl --
              /bin/bash -ec '
              status=$({
              if [[ -n "${TEI_BASIC_AUTH_USERNAME:-}" || -n "${TEI_BASIC_AUTH_PASSWORD:-}" ]]; then
                [[ -n "${TEI_BASIC_AUTH_USERNAME:-}" && -n "${TEI_BASIC_AUTH_PASSWORD:-}" ]] || exit 2;
                printf "user = \"%s:%s\"\n" "$TEI_BASIC_AUTH_USERNAME" "$TEI_BASIC_AUTH_PASSWORD";
              fi;
              printf "url = \"%s/health\"\n" "$TEI_DENSE_URL";
              } |
              docker run --rm -i --network musubi-shared-inference
              {{ musubi_curl_image }} --config - --connect-timeout 2 --max-time 3
              --silent --output /dev/null --write-out "%{http_code}");
              test "$status" = 401'
            executable: /bin/bash
          changed_when: false
          no_log: true
          register: retired_credential_probe
          retries: 30
          delay: 1
          until: retired_credential_probe.rc == 0

        - name: Record completed authentication migration
          ansible.builtin.copy:
            content: "musubi shared-inference credential v2 active\n"
            dest: "{{ musubi_config_dir }}/shared-inference-auth-v2"
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"

      rescue:
        - name: Restore the previous shared-inference Compose definition
          ansible.builtin.copy:
            src: "{{ auth_rotation_backup.path }}/shared-inference-compose.yml"
            dest: "{{ musubi_config_dir }}/shared-inference-compose.yml"
            remote_src: true
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"

        - name: Restore the previous Musubi Compose definition
          ansible.builtin.copy:
            src: "{{ auth_rotation_backup.path }}/docker-compose.yml"
            dest: "{{ musubi_config_dir }}/docker-compose.yml"
            remote_src: true
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"

        - name: Restore the previous Musubi environment
          ansible.builtin.copy:
            src: "{{ auth_rotation_backup.path }}/.env.production"
            dest: "{{ musubi_config_dir }}/.env.production"
            remote_src: true
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          no_log: true

        - name: Restore the previous Musubi credential references
          ansible.builtin.copy:
            src: "{{ auth_rotation_backup.path }}/secrets.tpl"
            dest: "{{ musubi_config_dir }}/secrets.tpl"
            remote_src: true
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          no_log: true

        - name: Restore the previous ingress credential references
          ansible.builtin.copy:
            src: "{{ auth_rotation_backup.path }}/shared-inference.htpasswd.tpl"
            dest: "{{ musubi_config_dir }}/shared-inference.htpasswd.tpl"
            remote_src: true
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          no_log: true

        - name: Restore the previous runtime shared-inference.htpasswd
          ansible.builtin.shell:
            cmd: >-
              candidate=$(mktemp /run/shared-inference-secrets/htpasswd.XXXXXX) &&
              trap 'rm -f "$candidate"' EXIT &&
              cat "{{ auth_rotation_backup.path }}/shared-inference.htpasswd" > "$candidate" &&
              chown 101:101 "$candidate" &&
              chmod 0400 "$candidate" &&
              mv -f "$candidate" /run/shared-inference-secrets/shared-inference.htpasswd
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Restore the previous producer topology after a first-time migration failure
          ansible.builtin.command:
            cmd: >-
              /usr/bin/timeout --signal=TERM --kill-after=5s 320s
              /usr/bin/docker compose -p shared-inference
              -f {{ musubi_config_dir }}/shared-inference-compose.yml
              up -d --force-recreate --wait --wait-timeout 300
          changed_when: true
          no_log: true
          when: producer_reconcile_required

        - name: Remount the restored ingress credential without restarting producers
          ansible.builtin.command:
            cmd: >-
              /usr/bin/timeout --signal=TERM --kill-after=5s 30s
              /usr/bin/docker compose -p shared-inference
              -f {{ musubi_config_dir }}/shared-inference-compose.yml
              up -d --no-deps --force-recreate inference-ingress
          changed_when: true
          no_log: true
          when: not producer_reconcile_required

        - name: Prove the restored ingress credential is ready
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              /usr/bin/timeout --signal=TERM --kill-after=1s 5s /usr/bin/op run
              --env-file={{ auth_rotation_backup.path }}/secrets.tpl --
              /bin/bash -ec '
              {
              if [[ -n "${TEI_BASIC_AUTH_USERNAME:-}" || -n "${TEI_BASIC_AUTH_PASSWORD:-}" ]]; then
                [[ -n "${TEI_BASIC_AUTH_USERNAME:-}" && -n "${TEI_BASIC_AUTH_PASSWORD:-}" ]] || exit 2;
                printf "user = \"%s:%s\"\n" "$TEI_BASIC_AUTH_USERNAME" "$TEI_BASIC_AUTH_PASSWORD";
              fi;
              printf "url = \"%s/health\"\n" "$TEI_DENSE_URL";
              } |
              docker run --rm -i --network musubi-shared-inference
              {{ musubi_curl_image }} --config - --connect-timeout 2 --max-time 3
              --fail --silent --show-error >/dev/null'
            executable: /bin/bash
          changed_when: false
          no_log: true
          register: restored_credential_probe
          retries: 30
          delay: 1
          until: restored_credential_probe.rc == 0

        - name: Restart Musubi with the restored credential
          ansible.builtin.systemd_service:
            name: musubi
            state: restarted

        - name: Refuse a failed authentication migration after rollback
          ansible.builtin.fail:
            msg: Shared-inference authentication migration failed and the previous credential was restored

      always:
        - name: Remove staged auth templates
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ musubi_config_dir }}/shared-inference.htpasswd.rotation.tpl"
            - "{{ musubi_config_dir }}/secrets.shared-inference-v2.tpl"

        - name: Remove auth rollback material
          ansible.builtin.file:
            path: "{{ auth_rotation_backup.path }}"
            state: absent
          check_mode: false
