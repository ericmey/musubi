---
# Run on the controller before a playbook mutates the workload host. These are
# 1Password item references and usernames, not material credential values.
- name: Require complete operator-owned reference configuration
  ansible.builtin.assert:
    that:
      - musubi_op_refs is mapping
      - >-
        (
          ['jwt_signing_key', 'qdrant_api_key', 'lifecycle_llm_api_key',
           'tei_dense_url', 'tei_sparse_url', 'tei_reranker_url',
           'tei_basic_auth_username', 'tei_basic_auth_password',
           'shared_inference_tls_cert', 'shared_inference_tls_key']
          | difference((musubi_op_refs | default({})).keys() | list)
          | length
        ) == 0
    fail_msg: "Set all musubi_op_refs in the private inventory before deploying"
  delegate_to: localhost
  run_once: true

- name: Require valid 1Password item references
  ansible.builtin.assert:
    that:
      - item.value is string
      - item.value is match('^op://[^\\r\\n]+$')
    fail_msg: "Every musubi_op_refs value must be an op:// item reference"
  loop: "{{ musubi_op_refs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Require active shared-inference consumers
  ansible.builtin.assert:
    that:
      - musubi_shared_inference_auth_consumers is sequence
      - musubi_shared_inference_auth_consumers is not string
      - musubi_shared_inference_auth_consumers | length > 0
    fail_msg: "Set at least one shared-inference consumer in the private inventory"
  delegate_to: localhost
  run_once: true

- name: Require valid active consumer names and references
  ansible.builtin.assert:
    that:
      - item.name | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - item.ref | default('') is match('^op://[^\\r\\n]+$')
    fail_msg: "Each shared-inference consumer needs a name and op:// hash reference"
  loop: "{{ musubi_shared_inference_auth_consumers }}"
  loop_control:
    label: "{{ item.name | default('invalid') }}"
  delegate_to: localhost
  run_once: true
  no_log: true

- name: Require distinct active consumer names
  ansible.builtin.assert:
    that:
      - >-
        musubi_shared_inference_auth_consumers | map(attribute='name') |
        unique | list | length == musubi_shared_inference_auth_consumers | length
    fail_msg: "Shared-inference consumer names must be distinct"
  delegate_to: localhost
  run_once: true

- name: Require transition consumers for authentication migration
  ansible.builtin.assert:
    that:
      - musubi_shared_inference_transition_consumers is sequence
      - musubi_shared_inference_transition_consumers is not string
      - musubi_shared_inference_transition_consumers | length > 0
    fail_msg: "Set transition consumers in the private inventory before migration"
  delegate_to: localhost
  run_once: true
  when: musubi_require_transition_consumers | default(false)

- name: Require valid transition consumer names and references
  ansible.builtin.assert:
    that:
      - item.name | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - item.ref | default('') is match('^op://[^\\r\\n]+$')
    fail_msg: "Each transition consumer needs a name and op:// hash reference"
  loop: "{{ musubi_shared_inference_transition_consumers | default([]) }}"
  loop_control:
    label: "{{ item.name | default('invalid') }}"
  delegate_to: localhost
  run_once: true
  no_log: true
  when: musubi_require_transition_consumers | default(false)

- name: Require distinct transition consumer names
  ansible.builtin.assert:
    that:
      - >-
        musubi_shared_inference_transition_consumers | map(attribute='name') |
        unique | list | length == musubi_shared_inference_transition_consumers | length
    fail_msg: "Transition consumer names must be distinct"
  delegate_to: localhost
  run_once: true
  when: musubi_require_transition_consumers | default(false)
