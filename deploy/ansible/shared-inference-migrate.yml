---
- name: Migrate TEI ownership to authenticated shared inference
  hosts: musubi
  become: true
  force_handlers: true
  handlers:
    - name: Remove rollback material after an early failure
      ansible.builtin.file:
        path: "{{ migration_backup.path }}"
        state: absent
      check_mode: false
  tasks:
    - name: Allocate a per-attempt rollback directory
      ansible.builtin.tempfile:
        state: directory
        prefix: musubi-shared-inference-rollback.
      register: migration_backup
      # The backup copy tasks need a real destination even during the required
      # pre-deploy --check run. The forced handler covers failures before the
      # bounded handoff's always block is entered.
      check_mode: false
      notify: Remove rollback material after an early failure

    - name: Preserve every coupled live artifact for this attempt
      ansible.builtin.copy:
        src: "{{ musubi_config_dir }}/{{ item }}"
        dest: "{{ migration_backup.path }}/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        force: true
      loop:
        - docker-compose.yml
        - secrets.tpl
        - .env.production

    - name: Create the private shared inference network
      ansible.builtin.shell:
        cmd: docker network inspect musubi-shared-inference >/dev/null 2>&1 || docker network create musubi-shared-inference
      register: inference_network
      changed_when: "'musubi-shared-inference' in inference_network.stdout"

    - name: Render shared inference Compose file
      ansible.builtin.template:
        src: templates/shared-inference-compose.yml.j2
        dest: "{{ musubi_config_dir }}/shared-inference-compose.yml"
        owner: root
        group: "{{ musubi_service_group }}"
        mode: "0640"

    - name: Render shared inference ingress
      ansible.builtin.template:
        src: templates/shared-inference-ingress.nginx.conf.j2
        dest: "{{ musubi_config_dir }}/shared-inference-ingress.conf"
        owner: root
        group: "{{ musubi_service_group }}"
        mode: "0640"

    - name: Render shared inference credential references
      ansible.builtin.template:
        src: templates/shared-inference.htpasswd.tpl.j2
        dest: "{{ musubi_config_dir }}/shared-inference.htpasswd.tpl"
        owner: root
        group: "{{ musubi_service_group }}"
        mode: "0640"

    - name: Stage candidate Musubi credential references without changing live state
      ansible.builtin.template:
        src: templates/secrets.tpl.j2
        dest: "{{ musubi_config_dir }}/secrets.shared-inference-candidate.tpl"
        owner: root
        group: "{{ musubi_service_group }}"
        mode: "0640"
      no_log: true

    - name: Install the independent shared inference unit
      ansible.builtin.template:
        src: templates/shared-inference.service.j2
        dest: /etc/systemd/system/shared-inference.service
        owner: root
        group: root
        mode: "0644"

    - name: Validate the candidate deployment before touching the live owner
      ansible.builtin.command:
        cmd: docker compose -p shared-inference -f {{ musubi_config_dir }}/shared-inference-compose.yml config --quiet
      changed_when: false

    - name: Reload systemd for the candidate unit
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Perform the bounded single-GPU ownership handoff
      block:
        - name: Stop Musubi consumers during the model-owner handoff
          ansible.builtin.command:
            cmd: >-
              docker compose --project-directory {{ musubi_config_dir }}
              -f {{ migration_backup.path }}/docker-compose.yml
              stop core lifecycle-worker
          changed_when: true

        - name: Stop Compose-owned TEI for the bounded handoff
          ansible.builtin.command:
            cmd: >-
              docker compose --project-directory {{ musubi_config_dir }}
              -f {{ migration_backup.path }}/docker-compose.yml
              stop tei-dense tei-sparse tei-reranker
          changed_when: true

        - name: Remove stopped Compose-owned TEI containers
          ansible.builtin.command:
            cmd: >-
              docker compose --project-directory {{ musubi_config_dir }}
              -f {{ migration_backup.path }}/docker-compose.yml
              rm -f tei-dense tei-sparse tei-reranker
          changed_when: true

        - name: Start authenticated shared inference
          ansible.builtin.systemd_service:
            name: shared-inference
            enabled: true
            state: restarted
          # The unit does not exist until this same check-mode run renders it.
          # Querying systemd for it would turn a clean preview into a false red.
          when: not ansible_check_mode

        - name: Verify shared inference parity through authentication
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              exec /usr/bin/timeout --signal=TERM --kill-after=2s 12s
              /usr/bin/op run --env-file={{ musubi_config_dir }}/secrets.shared-inference-candidate.tpl --
              /usr/bin/docker run --rm --network musubi-shared-inference
              -e TEI_DENSE_URL -e TEI_SPARSE_URL -e TEI_RERANKER_URL
              {{ musubi_curl_image }} sh -ec
              'for url in "$TEI_DENSE_URL" "$TEI_SPARSE_URL" "$TEI_RERANKER_URL";
               do curl --fail --silent --show-error --connect-timeout 2 --max-time 3
                 "$url/health" >/dev/null; done'
            executable: /bin/bash
          register: inference_parity
          retries: 5
          delay: 5
          until: inference_parity.rc == 0
          changed_when: false
          no_log: true

        - name: Prove ingress logs retain no request payload or payload hash
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              exec /usr/bin/op run --env-file={{ musubi_config_dir }}/secrets.shared-inference-candidate.tpl --
              /bin/bash -ec '
              sentinel="shared-inference-log-sentinel-$(date +%s%N)";
              digest="$(printf %s "$sentinel" | sha256sum | cut -d" " -f1)";
              payload="{\"inputs\":\"$sentinel\"}";
              docker run --rm --network musubi-shared-inference {{ musubi_curl_image }}
                curl --fail --silent --show-error -H "content-type: application/json"
                -d "$payload" "$TEI_DENSE_URL/embed" >/dev/null;
              docker run --rm --network musubi-shared-inference {{ musubi_curl_image }}
                curl --silent --show-error -u invalid:invalid -H "content-type: application/json"
                -d "$payload" "$TEI_DENSE_URL/embed" >/dev/null;
              logs="$(docker compose -p shared-inference
                -f {{ musubi_config_dir }}/shared-inference-compose.yml logs --no-color inference-ingress)";
              case "$logs" in *"$sentinel"*|*"$digest"*) exit 96;; esac'
            executable: /bin/bash
          changed_when: false
          no_log: true

        - name: Commit shared inference ownership in the Musubi Compose file
          ansible.builtin.template:
            src: templates/docker-compose.yml.j2
            dest: "{{ musubi_config_dir }}/docker-compose.yml"
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"

        - name: Commit authenticated inference URLs
          ansible.builtin.copy:
            src: "{{ musubi_config_dir }}/secrets.shared-inference-candidate.tpl"
            dest: "{{ musubi_config_dir }}/secrets.tpl"
            remote_src: true
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          no_log: true
          # The candidate template is intentionally only previewed in check
          # mode, so there are no remote bytes to copy into the live path.
          when: not ansible_check_mode

        - name: Restart Musubi against shared inference
          ansible.builtin.systemd_service:
            name: musubi
            state: restarted

        - name: Wait for Musubi Core after the ownership handoff
          ansible.builtin.uri:
            url: "{{ musubi_health_urls.core }}"
            status_code: 200
          register: migrated_core_health
          retries: 12
          delay: 5
          until: migrated_core_health.status == 200
          changed_when: false

        - name: Prove a real Musubi consumer can reach every authenticated route
          ansible.builtin.shell:
            cmd: >-
              /usr/bin/docker compose -f {{ musubi_config_dir }}/docker-compose.yml exec -T core
              python -c 'import httpx,os; urls=[os.environ[k] for k in
              ("TEI_DENSE_URL","TEI_SPARSE_URL","TEI_RERANKER_URL")];
              [httpx.get(u+"/health",timeout=20).raise_for_status() for u in urls]'
            executable: /bin/bash
          changed_when: false
          no_log: true

        - name: Record completed ownership migration
          ansible.builtin.copy:
            content: "shared-inference owns TEI\n"
            dest: "{{ musubi_config_dir }}/shared-inference-migrated"
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"

      rescue:
        - name: Stop the failed shared inference candidate
          ansible.builtin.systemd_service:
            name: shared-inference
            state: stopped
          failed_when: false

        - name: Rollback shared inference ownership
          ansible.builtin.copy:
            src: "{{ migration_backup.path }}/{{ item }}"
            dest: "{{ musubi_config_dir }}/{{ item }}"
            remote_src: true
            owner: root
            group: "{{ musubi_service_group }}"
            mode: "0640"
          loop:
            - docker-compose.yml
            - secrets.tpl
            - .env.production

        - name: Restore the previous TEI owner
          ansible.builtin.shell:
            cmd: >-
              set -a && . /etc/musubi/connect.env && set +a &&
              exec /usr/bin/op run --env-file={{ musubi_config_dir }}/secrets.tpl --
              /usr/bin/docker compose -f {{ musubi_config_dir }}/docker-compose.yml
              up -d --wait --wait-timeout 300 tei-dense tei-sparse tei-reranker
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Restore Musubi consumers
          ansible.builtin.systemd_service:
            name: musubi
            state: restarted

        - name: Refuse a failed migration after rollback
          ansible.builtin.fail:
            msg: Shared inference migration failed and the previous TEI owner was restored

      always:
        - name: Remove staged candidate credential references
          ansible.builtin.file:
            path: "{{ musubi_config_dir }}/secrets.shared-inference-candidate.tpl"
            state: absent

        - name: Remove per-attempt rollback material
          ansible.builtin.file:
            path: "{{ migration_backup.path }}"
            state: absent
          check_mode: false
