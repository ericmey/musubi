name: Vault check

on:
  push:
    branches: [main]
    paths:
      - "docs/Musubi/**"
      - ".github/workflows/vault-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/Musubi/**"
      - ".github/workflows/vault-check.yml"

permissions:
  contents: read

jobs:
  hygiene:
    name: Vault hygiene (frontmatter + spec contracts + wikilinks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # Required by docs/Musubi/_tools/check.py for frontmatter parsing.
        run: pip install --no-cache-dir pyyaml

      - name: check.py all (authoritative gate)
        # Same script `make agent-check` runs locally. Covers frontmatter schema,
        # spec Test Contract hygiene (presence, implements: field), and wikilink
        # resolution (.md + .canvas + .base; skips code spans + _templates/).
        run: python3 docs/Musubi/_tools/check.py all
