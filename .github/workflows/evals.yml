name: Evals

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  # On-demand: workflow_dispatch lives on the default branch (landed via #550) so the live scheduled
  # gate can be dispatched against a feature ref pre-merge to produce real x86 Qdrant+TEI numbers.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR gate: deterministic, network-free fixed-embedding smoke — no real models.
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run PR Smoke Gate
        run: |
          uv run python -m musubi.evals smoke --data-dir tests/evals/data

  # Scheduled gate: the ONLY place real quality NUMBERS are produced. Boots the real Qdrant + TEI
  # stack on x86, then runs the live scheduled gate + the BEIR hybrid-vs-dense measurement. The live
  # gate FAILS LOUD without this stack, so a scheduled run that skipped the boot could never pass —
  # the boot step is load-bearing, not optional.
  scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Boot Qdrant + TEI stack
        run: |
          docker compose -f deploy/test-env/docker-compose.test.yml -p musubi-evals up -d --wait --wait-timeout 600
      - name: Run Scheduled Live Quality Gate
        # The ChunkedEmbedder loads the gated SPLADE-v3 tokenizer for sparse chunking; without an auth
        # token a cache-miss 401s (the same gotcha integration.yml wires). Provide the HF secret.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -a && . deploy/test-env/.env.test && set +a
          uv run python -m musubi.evals scheduled --data-dir tests/evals/data
      - name: Run BEIR hybrid-vs-dense gate
        # Independent owner for integration.yml's one named exclusion. Without
        # always(), a failure in the sibling live gate skips this measurement.
        # This step still exits non-zero on its own threshold failure, so either
        # quality gate can fail the scheduled job independently.
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -a && . deploy/test-env/.env.test && set +a
          uv run pytest -m integration -k beir_style_eval tests/retrieve/test_hybrid.py -ra
      - name: Tear down stack
        if: always()
        run: |
          docker compose -f deploy/test-env/docker-compose.test.yml -p musubi-evals down -v --remove-orphans

  # A failed scheduled run is otherwise visible only to someone who inspects Actions history.
  # Reconcile one owner-assigned Issue so the failure becomes durable operator work, while a
  # subsequent green run records recovery and closes it. This job is deliberately outside the
  # pull_request path: PR smoke results must never create or close the production-quality incident.
  report_scheduled_result:
    needs: scheduled
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile scheduled Evals incident
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.scheduled.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            try {
              const { reconcileScheduledEvals } = require(
                './.github/scripts/report-scheduled-evals.js'
              );
              await reconcileScheduledEvals({
                github,
                context,
                result: process.env.RESULT,
                runUrl: process.env.RUN_URL,
              });
            } catch (error) {
              core.setFailed(`failed to reconcile scheduled Evals incident: ${error.message}`);
            }
